name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Test with pytest
        run: pytest --cov=src --cov-report=term-missing

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1 || {
            echo "::error::SSH key validation failed. The SSH_PRIVATE_KEY secret may be malformed."
            echo "Key first line: $(head -1 ~/.ssh/deploy_key)"
            echo "Key line count: $(wc -l < ~/.ssh/deploy_key)"
            exit 1
          }
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=30 \
              -i ~/.ssh/deploy_key \
              "${SSH_USER}@${SSH_HOST}" "
            set -e
            docker pull ghcr.io/qwr3rw1e1/banksys_sy_wangliang:latest
            docker stop banksys_sy_wangliang 2>/dev/null || true
            docker rm banksys_sy_wangliang 2>/dev/null || true
            docker run -d \
              --name banksys_sy_wangliang \
              --restart unless-stopped \
              -p 8888:8888 \
              ghcr.io/qwr3rw1e1/banksys_sy_wangliang:latest
            echo 'Deploy completed — http://117.72.172.21:8888'
          "
